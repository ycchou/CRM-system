<!-- --- START OF FILE JavaScript.html --- -->

<script>
document.addEventListener("DOMContentLoaded", () => {
    // --- ELEMENTS ---
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');
    // NEW: Mobile Elements
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    
    const loader = document.getElementById("loader");
    const pages = { 
        dashboard: document.getElementById("page-dashboard"), 
        members: document.getElementById("page-members"),
        reconciliation: document.getElementById("page-reconciliation")
    };
    const navLinks = { 
        dashboard: document.getElementById("nav-dashboard"), 
        members: document.getElementById("nav-members"), 
        reconciliation: document.getElementById("nav-reconciliation"),
        backend: document.getElementById("nav-backend") 
    };
    
    // Member page elements
    const addMemberBtn = document.getElementById("add-member-btn");
    const emailAllBtn = document.getElementById("email-all-btn");
    const downloadBtn = document.getElementById("download-csv-btn");
    const modal = document.getElementById("member-modal");
    const modalCloseBtn = document.querySelector(".modal-close-btn");
    const memberForm = document.getElementById("member-form");
    const modalTitle = document.getElementById("modal-title");
    const tableBody = document.getElementById("member-table-body");
    const searchInput = document.getElementById("search-input");
    const searchResultCount = document.getElementById("search-result-count");
    
    // Reconciliation page elements
    const fileInput = document.getElementById("file-input");
    const fileInfo = document.getElementById("file-info");
    const reconcileBtn = document.getElementById("reconcile-btn");
    const resultsSection = document.getElementById("results-section");

    let memberStore = []; 
    let currentlyDisplayedMembers = [];
    let charts = {}; 

    // Chart.js Setup
    Chart.register(ChartDataLabels);
    Chart.defaults.plugins.datalabels.color = '#fff';
    Chart.defaults.plugins.datalabels.font = { weight: 'bold' };

    // --- CORE FUNCTIONS ---
    const showLoader = (show) => { loader.style.display = show ? "flex" : "none"; };
    
    const switchPage = (pageName) => {
        Object.values(pages).forEach(p => p.classList.remove('active'));
        Object.values(navLinks).forEach(a => a.classList.remove('active'));
        pages[pageName].classList.add('active');
        navLinks[pageName].classList.add('active');
        
        // 自動關閉手機側邊欄
        if (window.innerWidth <= 768) {
            closeMobileSidebar();
        }

        if (pageName === 'dashboard') loadDashboardData();
        if (pageName === 'members') loadMemberData();
    };

    const handleBackendSuccess = (message, shouldReload = false) => {
        alert(message);
        if (shouldReload) loadMemberData();
        closeModal();
        showLoader(false);
    };
    const handleBackendFailure = (error) => {
        alert(`操作失敗: ${error.message || error}`);
        showLoader(false);
    };

    // --- MOBILE SIDEBAR LOGIC ---
    const toggleMobileSidebar = () => {
        sidebar.classList.toggle('mobile-open');
    };
    const closeMobileSidebar = () => {
        sidebar.classList.remove('mobile-open');
    };

    // --- RECONCILIATION PAGE LOGIC ---
    const handleFileSelect = (event) => {
        const file = event.target.files[0];
        fileInfo.textContent = file ? `已選擇: ${file.name}` : '';
    };
    const startReconciliation = () => {
        const file = fileInput.files[0];
        if (!file) { alert("請先選擇檔案。"); return; }
        showLoader(true);
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { range: 2 });
                if (jsonData.length === 0 || !jsonData[0]['員編']) throw new Error("格式錯誤: 找不到 '員編' 欄位");
                
                google.script.run
                    .withSuccessHandler(handleReconciliationResult)
                    .withFailureHandler(handleBackendFailure)
                    .reconcileDues(jsonData);
            } catch (e) {
                alert(e.message); showLoader(false);
            }
        };
        reader.readAsArrayBuffer(file);
    };
    const handleReconciliationResult = (response) => {
        if (!response.success) { handleBackendFailure(new Error(response.error)); return; }
        const { missing, extra, newMembers, specialCases } = response.results;
        const renderTable = (id, data, cols) => {
            const tbody = document.querySelector(`#${id} tbody`);
            tbody.innerHTML = data.length ? '' : `<tr><td colspan="${cols.length}">無資料</td></tr>`;
            data.forEach(item => {
                const row = tbody.insertRow();
                cols.forEach(col => row.insertCell().textContent = item[col.key] || '');
            });
        };
        document.getElementById('missing-count').textContent = missing.length;
        renderTable('missing-table', missing, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'unit'}]);
        document.getElementById('extra-count').textContent = extra.length;
        renderTable('extra-table', extra, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'amount'}]);
        document.getElementById('new-member-count').textContent = newMembers.length;
        renderTable('new-member-table', newMembers, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'amount'}]);
        document.getElementById('special-case-count').textContent = specialCases.length;
        renderTable('special-case-table', specialCases, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'amount'}]);
        
        resultsSection.style.display = 'grid';
        showLoader(false);
        alert("核對完成！");
    };

    // --- MEMBER PAGE LOGIC ---
    const loadMemberData = () => {
        showLoader(true);
        google.script.run.withSuccessHandler(data => { memberStore = data; renderMemberTable(memberStore); showLoader(false); }).withFailureHandler(handleBackendFailure).getMembers();
    };
    const renderMemberTable = (members) => {
        tableBody.innerHTML = "";
        currentlyDisplayedMembers = members;
        members.forEach(m => {
            const row = tableBody.insertRow();
            row.innerHTML = `<td>${m["姓名"]||''}</td><td>${m["會員編號"]||''}</td><td>${m["院區"]||''}</td><td>${m["單位"]||''}</td><td>${m["職稱"]||''}</td>
            <td><button class="btn-email" data-row="${m.row}">✉️</button><button class="btn-edit" data-row="${m.row}">✏️</button><button class="btn-delete" data-row="${m.row}">🗑️</button></td>`;
        });
        searchResultCount.textContent = searchInput.value ? `找到 ${members.length} 筆` : `共 ${memberStore.length} 筆`;
    };
    const handleSearch = () => {
        const term = searchInput.value.toLowerCase().trim();
        renderMemberTable(term ? memberStore.filter(m => Object.values(m).some(v => String(v).toLowerCase().includes(term))) : memberStore);
    };
    const downloadExcel = () => {
        if (!currentlyDisplayedMembers.length) { alert("無資料可下載"); return; }
        const headers = [ "入會日期", "退會日期", "會籍狀態", "會員編號", "會員類別", "勞工類別", "員工編號", "院區", "姓名", "職稱", "身分證字號", "生日", "手機", "通訊處", "常用E-MAIL", "院內E-mail", "臉書名稱", "line ID", "line 暱稱", "是否在會員line群", "入會單有無", "性別", "聯絡電話", "學歷/學校", "會費繳交方式" ];
        const data = [headers, ...currentlyDisplayedMembers.map(m => headers.map(h => m[h] || ''))];
        XLSX.writeFile(XLSX.utils.book_new(XLSX.utils.aoa_to_sheet(data)), "會員資料.xlsx");
    };
    const openModal = (mode, data = null) => {
        memberForm.reset();
        modalTitle.textContent = mode === 'add' ? "新增會員" : "編輯會員";
        document.getElementById('form-row-id').value = '';
        if (mode === 'edit' && data) for (const k in data) if (memberForm.elements[k]) memberForm.elements[k].value = data[k];
        modal.style.display = "block";
    };
    const closeModal = () => modal.style.display = "none";
    const handleFormSubmit = (e) => {
        e.preventDefault();
        showLoader(true);
        const obj = Object.fromEntries(new FormData(memberForm).entries());
        const func = obj.row ? 'updateMember' : 'addMember';
        google.script.run.withSuccessHandler(msg => handleBackendSuccess(msg, true)).withFailureHandler(handleBackendFailure)[func](obj);
    };
    const handleTableClick = (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const rowId = btn.dataset.row;
        const member = memberStore.find(m => m.row == rowId);
        if (btn.classList.contains('btn-edit')) openModal('edit', member);
        else if (btn.classList.contains('btn-delete')) { if(confirm(`刪除 ${member['姓名']}?`)) { showLoader(true); google.script.run.withSuccessHandler(msg => handleBackendSuccess(msg, true)).deleteMember(rowId); } }
        else if (btn.classList.contains('btn-email')) handleEmailRequest([member]);
    };
    
    // --- DASHBOARD ---
    const loadDashboardData = () => { showLoader(true); google.script.run.withSuccessHandler(data => { renderDashboard(data); showLoader(false); }).getDashboardAnalytics(); };
    const createChart = (id, config) => { 
        const ctx = document.getElementById(id).getContext('2d'); 
        if (charts[id]) charts[id].destroy(); 
        charts[id] = new Chart(ctx, config); 
    };
    const renderTable = (id, data, title) => {
        document.getElementById(id).innerHTML = `<thead><tr><th>${title}</th><th>人數</th></tr></thead><tbody>${data.map(i => `<tr><td>${i.key}</td><td>${i.value}</td></tr>`).join('')}</tbody>`;
    };
    const renderDashboard = (data) => {
        document.getElementById("kpi-total-members").textContent = data.totalActiveMembers;
        document.getElementById("kpi-new-this-month").textContent = data.newThisMonth;
        document.getElementById("kpi-leaves-this-month").textContent = data.leavesThisMonth;
        document.getElementById("kpi-avg-age").textContent = data.avgAge;
        
        const pieOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10 } } } };
        
        createChart('join-leave-month-chart', { type: 'bar', data: { labels: data.joinLeaveByMonth.map(d=>d.key), datasets: [{label:'入會',data:data.joinLeaveByMonth.map(d=>d.joins),backgroundColor:'#28a745'},{label:'退會',data:data.joinLeaveByMonth.map(d=>d.leaves),backgroundColor:'#dc3545'}] }, options: {maintainAspectRatio:false} });
        createChart('join-leave-year-chart', { type: 'bar', data: { labels: data.joinLeaveByYear.map(d=>d.key), datasets: [{label:'入會',data:data.joinLeaveByYear.map(d=>d.joins),backgroundColor:'#007bff'},{label:'退會',data:data.joinLeaveByYear.map(d=>d.leaves),backgroundColor:'#fd7e14'}] }, options: {maintainAspectRatio:false} });
        createChart('campus-chart', { type: 'doughnut', data: { labels: data.campusDistribution.map(d=>d.key), datasets: [{ data: data.campusDistribution.map(d=>d.value), backgroundColor: ['#0d6efd','#198754','#ffc107','#0dcaf0','#6f42c1'] }] }, options: pieOpts });
        renderTable('campus-table', data.campusDistribution, '院區');
        createChart('gender-chart', { type: 'pie', data: { labels: data.genderDistribution.map(d=>d.key), datasets: [{ data: data.genderDistribution.map(d=>d.value), backgroundColor: ['#007bff','#e83e8c'] }] }, options: pieOpts });
        renderTable('gender-table', data.genderDistribution, '性別');
        createChart('member-types-chart', { type: 'pie', data: { labels: data.memberTypeDistribution.map(d=>d.key), datasets: [{ data: data.memberTypeDistribution.map(d=>d.value), backgroundColor: ['#20c997','#6610f2'] }] }, options: pieOpts });
        renderTable('member-types-table', data.memberTypeDistribution, '會員類別');
        createChart('labor-types-chart', { type: 'pie', data: { labels: data.laborTypeDistribution.map(d=>d.key), datasets: [{ data: data.laborTypeDistribution.map(d=>d.value), backgroundColor: ['#dc3545','#fd7e14'] }] }, options: pieOpts });
        renderTable('labor-types-table', data.laborTypeDistribution, '勞工類別');
        createChart('age-chart', { type: 'bar', data: { labels: data.ageDistribution.map(d=>d.key), datasets: [{ label:'人數', data: data.ageDistribution.map(d=>d.value), backgroundColor: '#17a2b8' }] }, options: { maintainAspectRatio:false, plugins:{legend:{display:false}} } });
    };

    // --- EMAIL LOGIC ---
    const handleEmailRequest = (members) => {
        if (!members.length) return alert("無會員資料");
        const type = prompt("選擇信箱: 1:常用E-MAIL, 2:院內E-mail", "1");
        if(type!=='1'&&type!=='2') return;
        const field = type==='1'?'常用E-MAIL':'院內E-mail';
        const emails = members.map(m=>m[field]).filter(e=>e&&e.includes('@'));
        if(!emails.length) return alert("無有效Email");
        const str = emails.join(',');
        if(str.length>1800) {
            navigator.clipboard.writeText(str).then(()=>alert("名單過長，已複製到剪貼簿")).catch(()=>prompt("複製:",str));
        } else {
            window.open(`mailto:?bcc=${str}`);
        }
    };

    // --- INIT ---
    toggleBtn.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); localStorage.setItem('sb', sidebar.classList.contains('collapsed')); });
    if (localStorage.getItem('sb') === 'true') sidebar.classList.add('collapsed');
    
    // NEW: Mobile Events
    mobileMenuBtn.addEventListener('click', toggleMobileSidebar);
    sidebarOverlay.addEventListener('click', closeMobileSidebar);

    navLinks.dashboard.addEventListener('click', () => switchPage('dashboard'));
    navLinks.members.addEventListener('click', () => switchPage('members'));
    navLinks.reconciliation.addEventListener('click', () => switchPage('reconciliation'));
    google.script.run.withSuccessHandler(url => navLinks.backend.href = url).getSheetUrl();
    
    addMemberBtn.addEventListener('click', () => openModal('add'));
    emailAllBtn.addEventListener('click', () => handleEmailRequest(currentlyDisplayedMembers));
    downloadBtn.addEventListener('click', downloadExcel);
    modalCloseBtn.addEventListener('click', closeModal);
    window.addEventListener('click', e => { if (e.target == modal) closeModal(); });
    memberForm.addEventListener('submit', handleFormSubmit);
    tableBody.addEventListener('click', handleTableClick);
    searchInput.addEventListener('input', handleSearch);
    
    fileInput.addEventListener('change', handleFileSelect);
    reconcileBtn.addEventListener('click', startReconciliation);

    switchPage('dashboard');
});
</script>
