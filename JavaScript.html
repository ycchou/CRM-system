<script>
document.addEventListener("DOMContentLoaded", () => {
    // --- GLOBAL ELEMENTS & VARIABLES ---
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');
    const loader = document.getElementById("loader");
    const pages = { 
        dashboard: document.getElementById("page-dashboard"), 
        members: document.getElementById("page-members"),
        reconciliation: document.getElementById("page-reconciliation")
    };
    const navLinks = { 
        dashboard: document.getElementById("nav-dashboard"), 
        members: document.getElementById("nav-members"), 
        reconciliation: document.getElementById("nav-reconciliation"),
        backend: document.getElementById("nav-backend") 
    };
    
    // Member page elements
    const addMemberBtn = document.getElementById("add-member-btn");
    const emailAllBtn = document.getElementById("email-all-btn");
    const downloadBtn = document.getElementById("download-csv-btn");
    const modal = document.getElementById("member-modal");
    const modalCloseBtn = document.querySelector(".modal-close-btn");
    const memberForm = document.getElementById("member-form");
    const modalTitle = document.getElementById("modal-title");
    const tableBody = document.getElementById("member-table-body");
    const searchInput = document.getElementById("search-input");
    const searchResultCount = document.getElementById("search-result-count");
    
    // Reconciliation page elements
    const fileInput = document.getElementById("file-input");
    const fileInfo = document.getElementById("file-info");
    const reconcileBtn = document.getElementById("reconcile-btn");
    const resultsSection = document.getElementById("results-section");

    let memberStore = []; 
    let currentlyDisplayedMembers = [];
    let charts = {}; 

    Chart.register(ChartDataLabels);
    Chart.defaults.plugins.datalabels.color = '#fff';
    Chart.defaults.plugins.datalabels.font = { weight: 'bold' };

    // --- CORE APP FUNCTIONS ---
    const showLoader = (show) => { loader.style.display = show ? "flex" : "none"; };
    const switchPage = (pageName) => {
        Object.values(pages).forEach(p => p.classList.remove('active'));
        Object.values(navLinks).forEach(a => a.classList.remove('active'));
        pages[pageName].classList.add('active');
        navLinks[pageName].classList.add('active');
        
        if (pageName === 'dashboard') loadDashboardData();
        if (pageName === 'members') loadMemberData();
    };
    const handleBackendSuccess = (message, shouldReload = false) => {
        alert(message);
        if (shouldReload) loadMemberData();
        closeModal();
        showLoader(false);
    };
    const handleBackendFailure = (error) => {
        alert(`操作失敗: ${error.message || error}`);
        showLoader(false);
    };

    // --- RECONCILIATION PAGE LOGIC ---
    const handleFileSelect = (event) => {
        const file = event.target.files[0];
        if (file) {
            fileInfo.textContent = `已選擇檔案: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        } else {
            fileInfo.textContent = '';
        }
    };
    const startReconciliation = () => {
        const file = fileInput.files[0];
        if (!file) {
            alert("請先選擇一個 Excel 報表檔案。");
            return;
        }
        showLoader(true);
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { range: 2 });
                if (jsonData.length === 0 || !jsonData[0]['員編']) {
                   throw new Error("檔案格式不符或內容為空。請確認標題列位於第三列，且包含 '員編' 欄位。");
                }
                google.script.run
                    .withSuccessHandler(handleReconciliationResult)
                    .withFailureHandler(handleBackendFailure)
                    .reconcileDues(jsonData);
            } catch (e) {
                alert(`讀取檔案失敗: ${e.message}`);
                showLoader(false);
            }
        };
        reader.onerror = () => {
            alert("讀取檔案時發生錯誤。");
            showLoader(false);
        };
        reader.readAsArrayBuffer(file);
    };
    const handleReconciliationResult = (response) => {
        if (!response.success) {
            handleBackendFailure(new Error(response.error));
            return;
        }
        const { missing, extra, newMembers, specialCases } = response.results;
        const renderTable = (tableId, data, columns) => {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columns.length}">無資料</td></tr>`;
            } else {
                data.forEach(item => {
                    const row = tbody.insertRow();
                    columns.forEach(col => {
                        const cell = row.insertCell();
                        cell.textContent = item[col.key] !== undefined ? item[col.key] : '';
                    });
                });
            }
        };
        document.getElementById('missing-count').textContent = missing.length;
        renderTable('missing-table', missing, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'unit'}]);
        document.getElementById('extra-count').textContent = extra.length;
        renderTable('extra-table', extra, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'amount'}]);
        document.getElementById('new-member-count').textContent = newMembers.length;
        renderTable('new-member-table', newMembers, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'amount'}]);
        document.getElementById('special-case-count').textContent = specialCases.length;
        renderTable('special-case-table', specialCases, [{key: 'id'}, {key: 'name'}, {key: 'campus'}, {key: 'amount'}]);
        resultsSection.style.display = 'grid';
        showLoader(false);
        alert("核對完成！");
    };

    // --- MEMBER PAGE LOGIC ---
    const loadMemberData = () => {
        showLoader(true);
        google.script.run.withSuccessHandler(data => { memberStore = data; renderMemberTable(memberStore); showLoader(false); }).withFailureHandler(handleBackendFailure).getMembers();
    };
    const renderMemberTable = (membersToDisplay) => {
        tableBody.innerHTML = "";
        currentlyDisplayedMembers = membersToDisplay;
        membersToDisplay.forEach(member => {
            const row = tableBody.insertRow();
            row.innerHTML = `<td>${member["姓名"]||''}</td><td>${member["會員編號"]||''}</td><td>${member["院區"]||''}</td><td>${member["單位"]||''}</td><td>${member["職稱"]||''}</td><td><button class="btn-email" data-row="${member.row}" title="寄送信件">✉️</button><button class="btn-edit" data-row="${member.row}" title="編輯資料">✏️</button><button class="btn-delete" data-row="${member.row}" title="刪除會員">🗑️</button></td>`;
        });
        if (searchInput.value) { searchResultCount.textContent = `找到 ${membersToDisplay.length} 筆資料`; } 
        else { searchResultCount.textContent = `共 ${memberStore.length} 筆資料`; }
    };
    const handleSearch = () => {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const filteredMembers = searchTerm ? memberStore.filter(member => Object.values(member).some(value => String(value).toLowerCase().includes(searchTerm))) : memberStore;
        renderMemberTable(filteredMembers);
    };
    const downloadExcel = () => {
        const membersToDownload = currentlyDisplayedMembers;
        if (membersToDownload.length === 0) { alert("沒有可下載的資料。"); return; }
        const orderedHeaders = [ "入會日期", "退會日期", "會籍狀態", "會員編號", "會員類別", "勞工類別", "員工編號", "院區", "姓名", "職稱", "身分證字號", "生日", "手機", "通訊處", "常用E-MAIL", "院內E-mail", "臉書名稱", "line ID", "line 暱稱", "是否在會員line群", "入會單有無", "性別", "聯絡電話", "學歷/學校", "會費繳交方式" ];
        const dataForSheet = [orderedHeaders];
        membersToDownload.forEach(member => {
            const row = orderedHeaders.map(header => member[header] || '');
            dataForSheet.push(row);
        });
        const worksheet = XLSX.utils.aoa_to_sheet(dataForSheet);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "會員資料");
        const fileName = searchInput.value ? `會員資料_搜尋結果.xlsx` : `全體在籍會員資料.xlsx`;
        XLSX.writeFile(workbook, fileName);
    };
    const openModal = (mode = 'add', memberData = null) => {
        memberForm.reset();
        modalTitle.textContent = mode === 'add' ? "新增會員" : "編輯會員資料";
        document.getElementById('form-row-id').value = '';
        if (mode === 'edit' && memberData) { for (const key in memberData) { if (memberForm.elements[key]) { memberForm.elements[key].value = memberData[key]; } } }
        modal.style.display = "block";
    };
    const closeModal = () => { modal.style.display = "none"; };
    const handleFormSubmit = (event) => {
        event.preventDefault();
        showLoader(true);
        const memberObject = Object.fromEntries(new FormData(memberForm).entries());
        const backendFunction = memberObject.row ? 'updateMember' : 'addMember';
        google.script.run.withSuccessHandler(message => handleBackendSuccess(message, true)).withFailureHandler(handleBackendFailure)[backendFunction](memberObject);
    };
    const handleTableClick = (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const { classList, dataset } = button;
        const member = memberStore.find(m => m.row == dataset.row);
        if (classList.contains('btn-edit')) { if (member) openModal('edit', member); } 
        else if (classList.contains('btn-delete')) { if (confirm(`確定要刪除會員「${member["姓名"] || ''}」嗎？此操作無法復原。`)) { showLoader(true); google.script.run.withSuccessHandler(message => handleBackendSuccess(message, true)).withFailureHandler(handleBackendFailure).deleteMember(dataset.row); } } 
        else if (classList.contains('btn-email')) { if (member) handleEmailRequest([member]); }
    };
    
    // --- UPDATED EMAIL LOGIC (FIX FOR LONG LISTS) ---
    const handleEmailRequest = (members) => {
        if (!members || members.length === 0) { 
            alert("沒有可寄送的會員。"); 
            return; 
        }

        const emailOptions = [];
        if (members.some(m => m["常用E-MAIL"])) emailOptions.push("1: 常用E-MAIL");
        if (members.some(m => m["院內E-mail"])) emailOptions.push("2: 院內E-mail");

        if (emailOptions.length === 0) { 
            alert("選中的會員沒有可用的 E-mail 地址。"); 
            return; 
        }

        const choice = prompt(`請選擇要使用的信箱類型：\n\n${emailOptions.join('\n')}\n\n(請輸入數字 1 或 2)`);
        
        let emailField = '';
        if (choice === '1') emailField = '常用E-MAIL';
        else if (choice === '2') emailField = '院內E-mail';
        else { 
            if(choice) alert("無效的選擇。"); 
            return; 
        }

        // 提取有效 Email
        const validEmails = members
            .map(m => m[emailField])
            .filter(email => email && email.includes('@') && email.trim() !== '');

        if (validEmails.length === 0) { 
            alert(`在選擇的「${emailField}」類型中，找不到有效的 E-mail 地址。`); 
            return; 
        }

        const recipients = validEmails.join(',');

        // 檢查長度：若超過 1800 字元 (瀏覽器限制約 2000)，則使用剪貼簿複製
        if (validEmails.length > 1 && recipients.length > 1800) {
            navigator.clipboard.writeText(recipients)
                .then(() => {
                    alert(`✅ 已成功提取 ${validEmails.length} 筆 Email！\n\n由於名單過長，已自動複製到「剪貼簿」。\n\n請開啟您的郵件軟體，在【密件副本】欄位按下「貼上 (Ctrl+V)」即可。`);
                })
                .catch(err => {
                    console.error('複製失敗:', err);
                    prompt(`由於名單過長且自動複製失敗，請手動複製下方框內的 Email：`, recipients);
                });
        } else {
            // 長度在安全範圍內，直接開啟
            const mailtoLink = validEmails.length > 1 ? `mailto:?bcc=${recipients}` : `mailto:${recipients}`;
            window.open(mailtoLink, '_blank');
        }
    };
    
    // --- DASHBOARD LOGIC ---
    const loadDashboardData = () => { showLoader(true); google.script.run.withSuccessHandler(data => { renderDashboard(data); showLoader(false); }).withFailureHandler(handleBackendFailure).getDashboardAnalytics(); };
    const createOrUpdateChart = (chartId, chartConfig) => { const ctx = document.getElementById(chartId).getContext('2d'); if (charts[chartId]) charts[chartId].destroy(); charts[chartId] = new Chart(ctx, chartConfig); };
    const renderDistributionTable = (tableId, data, title) => { const table = document.getElementById(tableId); let html = `<thead><tr><th>${title}</th><th>人數</th></tr></thead><tbody>`; data.forEach(item => { html += `<tr><td>${item.key}</td><td>${item.value}</td></tr>`; }); html += `</tbody>`; table.innerHTML = html; };
    const renderDashboard = (data) => {
        document.getElementById("kpi-total-members").textContent = data.totalActiveMembers || 0;
        document.getElementById("kpi-new-this-month").textContent = data.newThisMonth || 0;
        document.getElementById("kpi-leaves-this-month").textContent = data.leavesThisMonth || 0;
        document.getElementById("kpi-avg-age").textContent = data.avgAge || "N/A";
        const campusColors = ['#0d6efd', '#198754', '#ffc107', '#0dcaf0', '#6f42c1', '#d63384'];
        const memberTypeColors = ['#20c997', '#6610f2', '#fd7e14', '#17a2b8'];
        const laborTypeColors = ['#dc3545', '#fd7e14', '#ffc107', '#0dcaf0'];
        const ageChartColor = '#17a2b8';
        createOrUpdateChart('join-leave-month-chart', { type: 'bar', data: { labels: data.joinLeaveByMonth.map(d => d.key), datasets: [ { label: '入會人數', data: data.joinLeaveByMonth.map(d => d.joins), backgroundColor: 'rgba(40, 167, 69, 0.8)' }, { label: '退會人數', data: data.joinLeaveByMonth.map(d => d.leaves), backgroundColor: 'rgba(220, 53, 69, 0.8)' } ] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } }, plugins: { datalabels: { display: false } } } });
        createOrUpdateChart('join-leave-year-chart', { type: 'bar', data: { labels: data.joinLeaveByYear.map(d => d.key), datasets: [ { label: '入會人數', data: data.joinLeaveByYear.map(d => d.joins), backgroundColor: 'rgba(0, 123, 255, 0.8)' }, { label: '退會人數', data: data.joinLeaveByYear.map(d => d.leaves), backgroundColor: 'rgba(253, 126, 20, 0.8)' } ] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: function(value) {if (value % 1 === 0) {return value;}} } } }, plugins: { datalabels: { display: true, anchor: 'end', align: 'top', color: '#555' } } } });
        const pieChartOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'right', labels: { boxWidth: 12, padding: 15 } }, datalabels: { formatter: (value, ctx) => { const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0); const percentage = (value / total * 100); return percentage > 3 ? percentage.toFixed(0) + '%' : ''; } } } };
        createOrUpdateChart('campus-chart', { type: 'doughnut', data: { labels: data.campusDistribution.map(d=>d.key), datasets: [{ data: data.campusDistribution.map(d=>d.value), backgroundColor: campusColors }] }, options: pieChartOptions });
        renderDistributionTable('campus-table', data.campusDistribution, '院區');
        const genderData = data.genderDistribution;
        const genderColors = genderData.map(item => { if (item.key === '男') return '#007bff'; if (item.key === '女') return '#e83e8c'; return '#6c757d'; });
        createOrUpdateChart('gender-chart', { type: 'pie', data: { labels: genderData.map(d => d.key), datasets: [{ data: genderData.map(d => d.value), backgroundColor: genderColors }] }, options: pieChartOptions });
        renderDistributionTable('gender-table', genderData, '性別');
        createOrUpdateChart('member-types-chart', { type: 'pie', data: { labels: data.memberTypeDistribution.map(d=>d.key), datasets: [{ data: data.memberTypeDistribution.map(d=>d.value), backgroundColor: memberTypeColors }] }, options: pieChartOptions });
        renderDistributionTable('member-types-table', data.memberTypeDistribution, '會員類別');
        createOrUpdateChart('labor-types-chart', { type: 'pie', data: { labels: data.laborTypeDistribution.map(d=>d.key), datasets: [{ data: data.laborTypeDistribution.map(d=>d.value), backgroundColor: laborTypeColors }] }, options: pieChartOptions });
        renderDistributionTable('labor-types-table', data.laborTypeDistribution, '勞工類別');
        createOrUpdateChart('age-chart', { type: 'bar', data: { labels: data.ageDistribution.map(d => d.key), datasets: [{ label: '人數', data: data.ageDistribution.map(d => d.value), backgroundColor: ageChartColor }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { display: true, anchor: 'end', align: 'end', color: '#fff' } } } });
    };

    // --- INITIALIZATION & EVENT LISTENERS ---
    const initialize = () => {
        toggleBtn.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed')); setTimeout(() => window.dispatchEvent(new Event('resize')), 300); });
        if (localStorage.getItem('sidebarCollapsed') === 'true') sidebar.classList.add('collapsed');
        navLinks.dashboard.addEventListener('click', (e) => { e.preventDefault(); switchPage('dashboard'); });
        navLinks.members.addEventListener('click', (e) => { e.preventDefault(); switchPage('members'); });
        navLinks.reconciliation.addEventListener('click', (e) => { e.preventDefault(); switchPage('reconciliation'); });
        google.script.run.withSuccessHandler(url => { if (url) navLinks.backend.href = url; }).getSheetUrl();
        
        addMemberBtn.addEventListener('click', () => openModal('add'));
        emailAllBtn.addEventListener('click', () => handleEmailRequest(currentlyDisplayedMembers));
        downloadBtn.addEventListener('click', downloadExcel);
        modalCloseBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (event) => { if (event.target == modal) closeModal(); });
        memberForm.addEventListener('submit', handleFormSubmit);
        tableBody.addEventListener('click', handleTableClick);
        searchInput.addEventListener('input', handleSearch);
        
        fileInput.addEventListener('change', handleFileSelect);
        reconcileBtn.addEventListener('click', startReconciliation);

        switchPage('dashboard');
    };

    initialize();
});
</script>
